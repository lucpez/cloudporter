<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #333; }
    header { background: #1a1a2e; color: white; padding: 1.5rem 2rem; }
    header h1 { font-size: 1.4rem; font-weight: 600; }
    main { max-width: 680px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: white; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #555; text-transform: uppercase; letter-spacing: .05em; }
    form { display: flex; gap: .75rem; flex-wrap: wrap; }
    input[type="text"] { flex: 1; min-width: 140px; padding: .6rem .9rem; border: 1px solid #ddd; border-radius: 6px; font-size: .95rem; }
    input[type="number"] { width: 100px; padding: .6rem .9rem; border: 1px solid #ddd; border-radius: 6px; font-size: .95rem; }
    button { padding: .6rem 1.2rem; background: #1a1a2e; color: white; border: none; border-radius: 6px; font-size: .95rem; cursor: pointer; }
    button:hover { background: #2d2d5e; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: .6rem .75rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: #888; border-bottom: 1px solid #eee; }
    td { padding: .75rem; border-bottom: 1px solid #f0f0f0; font-size: .95rem; }
    tr:last-child td { border-bottom: none; }
    .btn-delete { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1rem; padding: 0 .25rem; }
    .btn-delete:hover { color: #e53e3e; }
    .empty { color: #aaa; text-align: center; padding: 2rem 0; font-size: .95rem; }
  </style>
</head>
<body>
  <header><h1>Inventory</h1></header>
  <main>
    <div class="card">
      <h2>Add item</h2>
      <form id="form">
        <input type="text" id="name" placeholder="Item name" required>
        <input type="number" id="quantity" placeholder="Qty" min="0" required>
        <button type="submit">Add</button>
      </form>
    </div>
    <div class="card">
      <h2>Items</h2>
      <table>
        <thead><tr><th>Name</th><th>Quantity</th><th>Added</th><th></th></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </main>
  <script>
    async function load() {
      const res = await fetch('/api/items');
      const items = await res.json();
      const tbody = document.getElementById('list');
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty">No items yet</td></tr>';
        return;
      }
      tbody.innerHTML = items.map(i => `
        <tr>
          <td>${i.name}</td>
          <td>${i.quantity}</td>
          <td>${new Date(i.created_at).toLocaleDateString()}</td>
          <td><button class="btn-delete" data-id="${i.id}" title="Delete">✕</button></td>
        </tr>`).join('');

      tbody.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', async () => {
          await fetch(`/api/items/${btn.dataset.id}`, { method: 'DELETE' });
          load();
        });
      });
    }

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          quantity: Number(document.getElementById('quantity').value),
        }),
      });
      e.target.reset();
      load();
    });

    load();
  </script>
</body>
</html>
